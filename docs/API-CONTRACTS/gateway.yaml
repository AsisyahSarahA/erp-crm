components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageQuery:
      name: page
      in: query
      description: Current page number (default 1)
      schema:
        type: integer
        default: 1
    PerPageQuery:
      name: per_page
      in: query
      description: Items per page (default 15, max 100)
      schema:
        type: integer
        default: 15
    SearchQuery:
      name: search
      in: query
      description: Free-text search term
      schema:
        type: string

  responses:
    UnauthorizedError:
      description: Authentication token missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblemDetails'
    ValidationError:
      description: Form Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblemDetails'

  schemas:
    GatewayHealth:
      type: object
      properties:
        status:
          type: string
          example: "UP"
        service:
          type: string
          example: "astacode-gateway"
        timestamp:
          type: string

    ApiProblemDetails:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          example: "https://astacode.com/errors/validation-failed"
        title:
          type: string
          example: "Unprocessable Entity"
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: "Form validation failed."
        instance:
          type: string
          example: "/api/v1/crm/leads"
        correlation_id:
          type: string
          example: "9a2f1b4d-1234-4567-89ab-cdef01234567"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    UserResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        permissions:
          type: array
          items:
            type: string

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        token:
          type: string
        requires_2fa:
          type: boolean
        two_factor_token:
          type: string
        user:
          $ref: '#/components/schemas/UserResponse'

    Lead:
      type: object
      properties:
        id:
          type: integer
        lead_code:
          type: string
          example: "LD-2026-0001"
        customer_id:
          type: integer
        title:
          type: string
        project_type:
          type: string
        priority:
          type: string
          enum: [HOT, HIGH, MEDIUM, LOW]
        stage:
          type: string
          enum: [NEW_LEAD, FOLLOW_UP, REQUIREMENT, QUOTATION, NEGOTIATION, DEAL_WON, LOST]
        source:
          type: string
        est_value:
          type: number
        win_probability:
          type: integer
        sales_pic_name:
          type: string
        created_at:
          type: string

    CreateLeadInput:
      type: object
      required: [title, project_type, source, est_value]
      properties:
        title:
          type: string
        project_type:
          type: string
        source:
          type: string
        sub_source:
          type: string
        est_value:
          type: number
        priority:
          type: string
          default: "MEDIUM"
        contact_name:
          type: string
        contact_phone:
          type: string
        customer_id:
          type: integer

    LeadSingleResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Lead'

    LeadListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Lead'
        meta:
          type: object
          properties:
            current_page:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer

    Customer:
      type: object
      properties:
        id:
          type: integer
        customer_code:
          type: string
        legal_name:
          type: string
        brand_name:
          type: string
        customer_type:
          type: string
        industry:
          type: string
        phone:
          type: string
        status:
          type: string
        health_score:
          type: integer

    CustomerListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'

    Project:
      type: object
      properties:
        id:
          type: integer
        project_code:
          type: string
          example: "PRJ-001"
        customer_name:
          type: string
        title:
          type: string
        status:
          type: string
        health:
          type: string
        contract_value:
          type: number
        budget_mandays:
          type: integer
        consumed_mandays:
          type: number
        start_date:
          type: string
        target_end_date:
          type: string

    ProjectListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Project'

    Invoice:
      type: object
      properties:
        id:
          type: integer
        invoice_number:
          type: string
          example: "INV/2026/02/0001"
        customer_name:
          type: string
        project_title:
          type: string
        term_number:
          type: integer
        term_name:
          type: string
        dpp_amount:
          type: number
        vat_amount:
          type: number
        total_bill:
          type: number
        net_cash_receivable:
          type: number
        status:
          type: string
          enum: [DRAFT, ISSUED, PAID, OVERDUE, CANCELLED]
        issue_date:
          type: string
        due_date:
          type: string

    InvoiceListResponse:
      type: object
      properties:
        success:
          type: boolean

openapi: 3.1.0
info:
  title: ASTACODE ERP Orchestrator Gateway API
  description: |
    Spesifikasi OpenAPI Terpadu ASTACODE ERP Orchestrator.
    Semua panggilan frontend React dan integrasi eksternal diarahkan melalui API Gateway (`http://<host>:8000/api/v1`).
    Gateway menangani verifikasi sesi Sanctum/JWT, penandatanganan request HMAC internal, penanganan error RFC 7807,
    dan reverse proxy ke 8 microservice backend.
  version: 1.0.0
  contact:
    name: ASTACODE Engineering Team
    email: engineering@astacode.com

servers:
  - url: http://localhost:8000/api/v1
    description: Development API Gateway Proxy
  - url: https://api.astacode.com/v1
    description: Production API Gateway

paths:
  # ============================================================
  # 0. GATEWAY SYSTEM
  # ============================================================
  /health:
    get:
      tags: [Gateway]
      summary: Gateway Health Check
      responses:
        '200':
          description: Gateway is running and operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayHealth'

  # ============================================================
  # 1. CORE SERVICE (/core/*)
  # ============================================================
  /core/auth/login:
    post:
      tags: [Core - Auth]
      summary: User Login & 2FA Challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful or 2FA challenge required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /core/auth/2fa/verify:
    post:
      tags: [Core - Auth]
      summary: Verify RFC 6238 TOTP Code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [two_factor_token, code]
              properties:
                two_factor_token:
                  type: string
                code:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: 2FA successful, API token issued
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /core/auth/me:
    get:
      tags: [Core - Auth]
      summary: Get Current Authenticated User & Permissions
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /core/auth/logout:
    post:
      tags: [Core - Auth]
      summary: Revoke Session / Token
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful

  /core/users:
    get:
      tags: [Core - Users]
      summary: List System Users
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PerPageQuery'
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200':
          description: List of users with roles

  /core/roles:
    get:
      tags: [Core - RBAC]
      summary: List 14 Roles & Granular Permissions
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All RBAC roles

  /core/audit-logs:
    get:
      tags: [Core - Audit]
      summary: Query Append-only Immutable Audit Logs
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PerPageQuery'
      responses:
        '200':
          description: Audit logs list

  /core/settings:
    get:
      tags: [Core - Settings]
      summary: Get System & Company Settings
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Global configuration settings

  # ============================================================
  # 2. CRM SERVICE (/crm/*)
  # ============================================================
  /crm/public/lead-capture:
    post:
      tags: [CRM - Leads]
      summary: Public Lead Capture for Inbound Web Forms (FR-CRM-01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                company_name:
                  type: string
                project_title:
                  type: string
                budget:
                  type: number
                utm_source:
                  type: string
      responses:
        '201':
          description: Lead captured and queued for follow-up

  /crm/leads:
    get:
      tags: [CRM - Leads]
      summary: List Leads with Filter, Sort, Search, and Pagination
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/PerPageQuery'
        - $ref: '#/components/parameters/SearchQuery'
        - name: filter[stage]
          in: query
          schema:
            type: string
            enum: [NEW_LEAD, FOLLOW_UP, REQUIREMENT, QUOTATION, NEGOTIATION, DEAL_WON, LOST]
        - name: filter[priority]
          in: query
          schema:
            type: string
            enum: [HOT, HIGH, MEDIUM, LOW]
        - name: sort
          in: query
          schema:
            type: string
            example: "-created_at"
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadListResponse'

    post:
      tags: [CRM - Leads]
      summary: Create New Lead & Auto-Upsert Customer (FR-CRM-01)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeadInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadSingleResponse'
        '409':
          description: Duplicate customer detected (Tautkan / Buat baru / Gabung)
        '422':
          $ref: '#/components/responses/ValidationError'

  /crm/leads/export:
    get:
      tags: [CRM - Leads]
      summary: Export Leads to CSV
      security:
        - BearerAuth: []
      responses:
        '200':
          description: CSV stream

  /crm/leads/bulk-assign:
    post:
      tags: [CRM - Leads]
      summary: Bulk Reassign Leads to Sales Rep
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Leads assigned

  /crm/leads/bulk-tags:
    post:
      tags: [CRM - Leads]
      summary: Bulk Update Tags on Leads
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tags updated

  /crm/leads/bulk-delete:
    post:
      tags: [CRM - Leads]
      summary: Bulk Soft Delete Leads
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Leads deleted

  /crm/leads/{id}:
    get:
      tags: [CRM - Leads]
      summary: Get Lead Detail with Customer 360 & Quotations
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadSingleResponse'

    put:
      tags: [CRM - Leads]
      summary: Update Lead Stage / Details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stage:
                  type: string
                priority:
                  type: string
                est_value:
                  type: number
                win_probability:
                  type: integer
      responses:
        '200':
          description: Lead updated successfully

    delete:
      tags: [CRM - Leads]
      summary: Soft Delete Lead
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lead deleted

  /crm/leads/{id}/stage:
    patch:
      tags: [CRM - Leads]
      summary: Transition Lead Pipeline Stage via PipelineTransitionGuard (FR-CRM-24)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage:
                  type: string
                  enum: [new_lead, follow_up, requirement, quotation, negotiation, deal, reject]
                reason:
                  type: string
                override:
                  type: boolean
                reject_reason_code:
                  type: string
                reject_reason_id:
                  type: integer
                reject_notes:
                  type: string
                trigger_source:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadSingleResponse'
        '403':
          description: Forbidden Super Admin Override or Reopen
        '422':
          description: Pipeline Transition Guard Failure (includes guard_failure and deep_link_tab)

  /crm/leads/{id}/reopen:
    post:
      tags: [CRM - Leads]
      summary: Reopen Rejected Lead by Sales Manager (FR-CRM-10)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lead reopened to Follow Up stage
        '403':
          description: Forbidden for non-managers

  /crm/leads/{id}/checklists:
    get:
      tags: [CRM - Leads]
      summary: Get Mandatory Stage Activity Checklists & Progress
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stage checklists and lead progress

  /crm/leads/{id}/checklists/{checklistId}/toggle:
    post:
      tags: [CRM - Leads]
      summary: Toggle Completion Status of a Stage Checklist Item
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: checklistId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Checklist completion updated

  /crm/leads/{id}/next-actions:
    get:
      tags: [CRM - Leads]
      summary: Get Next Best Action Recommendations (Rule Engine + AI Gateway)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Next best actions and AI insights

  /crm/leads/{id}/audit-logs:
    get:
      tags: [CRM - Leads]
      summary: Get Immutable Audit Logs for Stage, Value, Discount, and TOP Changes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Immutable CRM audit log entries

  /crm/leads/{id}/activities:
    get:
      tags: [CRM - Activities]
      summary: Get Activities for a Specific Lead
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of lead activities
    post:
      tags: [CRM - Activities]
      summary: Create Activity for a Specific Lead (FR-CRM-04)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, title, start_at]
              properties:
                type:
                  type: string
                  enum: [MEETING, CALL, FOLLOW_UP, EMAIL, WHATSAPP, DEMO, SITE_VISIT, TASK, NOTE]
                title:
                  type: string
                notes:
                  type: string
                start_at:
                  type: string
                  format: date-time
                end_at:
                  type: string
                  format: date-time
                location:
                  type: string
                link:
                  type: string
                create_meet:
                  type: boolean
                attendees:
                  type: array
                  items:
                    type: object
      responses:
        '201':
          description: Activity created with meet link if requested

  /crm/activities:
    get:
      tags: [CRM - Activities]
      summary: List Activities with Filters & Search
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
        - name: date_to
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated activities
    post:
      tags: [CRM - Activities]
      summary: Create New Standalone Activity
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, title, start_at]
      responses:
        '201':
          description: Activity created

  /crm/activities/calendar:
    get:
      tags: [CRM - Activities]
      summary: Get Calendar Activities for Date Range (FR-CRM-04)
      security:
        - BearerAuth: []
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
        - name: end_date
          in: query
          schema:
            type: string
        - name: scope
          in: query
          schema:
            type: string
            enum: [mine, team, all]
      responses:
        '200':
          description: Calendar event items formatted for UI

  /crm/activities/{id}:
    get:
      tags: [CRM - Activities]
      summary: Get Activity Detail
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Activity detail
    patch:
      tags: [CRM - Activities]
      summary: Update Activity Details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Activity updated
    delete:
      tags: [CRM - Activities]
      summary: Delete Activity
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Activity deleted

  /crm/activities/{id}/complete:
    post:
      tags: [CRM - Activities]
      summary: Mark Activity as Completed with Required Outcome (FR-CRM-04)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [berhasil, reschedule, tidak_merespons, SUCCESS, RESCHEDULE, NO_RESPONSE]
                outcome_notes:
                  type: string
                next_step:
                  type: string
                next_activity:
                  type: object
      responses:
        '200':
          description: Activity completed and optional next activity created
        '422':
          description: Outcome is required

  /crm/activities/{id}/reschedule:
    post:
      tags: [CRM - Activities]
      summary: Reschedule Activity Start & End Times
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_at]
      responses:
        '200':
          description: Activity rescheduled

  /crm/activities/{id}/recording:
    post:
      tags: [CRM - Activities]
      summary: Attach Audio/Video Recording or Transcript
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recording or transcript saved

  /crm/activities/{id}/ai-notes:
    post:
      tags: [CRM - Activities]
      summary: Generate AI Meeting Notes from Transcript (FR-CRM-04)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: AI meeting notes with summary, decisions, action items

  /crm/activities/{id}/push-to-requirement:
    post:
      tags: [CRM - Activities]
      summary: Push Meeting Notes to Lead Requirement Draft
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notes pushed to requirement

  /crm/integrations/google/status:
    get:
      tags: [CRM - Integrations]
      summary: Check Google Calendar Connection Status
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Connection status

  /crm/integrations/google/auth-url:
    get:
      tags: [CRM - Integrations]
      summary: Get Google OAuth Authorization URL
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Auth URL and scope

  /crm/integrations/google/callback:
    post:
      tags: [CRM - Integrations]
      summary: Google OAuth Callback Exchange
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tokens exchanged and calendar connected

  /crm/integrations/google/disconnect:
    post:
      tags: [CRM - Integrations]
      summary: Disconnect Google Calendar Integration
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Disconnected

  /crm/webhooks/google-calendar:
    post:
      tags: [CRM - Integrations]
      summary: Webhook for Google Calendar Push Notifications
      responses:
        '200':
          description: Webhook received and synchronized

  /crm/leads/{id}/requirements:
    get:
      tags: [CRM - Requirements & AI RAB]
      summary: List Requirement Versions, Files, AI Runs & RAB Drafts for Lead (FR-CRM-05)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Requirement versions and active RAB draft
    post:
      tags: [CRM - Requirements & AI RAB]
      summary: Upload Requirement Prompt and/or Files (Doc/Audio/Image <= 25MB, Antivirus, PII Redaction, Auto-Transition to Requirement Stage)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Requirement version created
        '422':
          description: Validation or antivirus scan failure

  /crm/leads/{id}/requirements/generate:
    post:
      tags: [CRM - Requirements & AI RAB]
      summary: Trigger AI Generate RAB Async Job (FR-CRM-05, BR-CRM-10, AC-CRM-03)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Requirement version saved and GenerateRabJob dispatched

  /crm/leads/{id}/requirements/{requirementId}/use-as-rab:
    post:
      tags: [CRM - Requirements & AI RAB]
      summary: Human-in-the-Loop Action - Gunakan sebagai RAB (Clones AI RAB Draft into Editable Active RAB Version without Touching Quotation)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: requirementId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: New editable RAB version created from AI draft

  /crm/leads/{id}/requirements/{requirementId}/merge-to-rab:
    post:
      tags: [CRM - Requirements & AI RAB]
      summary: Human-in-the-Loop Action - Gabungkan (Merge) ke RAB Saat Ini (Preserves Previous RAB Version)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: requirementId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: New merged RAB version created

  /crm/rab/recalculate:
    post:
      tags: [CRM - RAB Engine]
      summary: Authoritative Stateless RAB Calculation Preview (Subtotal, Contingency, Discount, DPP, PPN, Terbilang, Margin Dual-View)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Calculated RAB summary and line items

  /crm/leads/{id}/rab:
    get:
      tags: [CRM - RAB Engine]
      summary: Get Active or Specific RAB Version for Lead with Dual-View Margin Filtering (FR-CRM-06, BR-CRM-07, AC-CRM-07)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Active RAB version and items
    put:
      tags: [CRM - RAB Engine]
      summary: Bulk Upsert RAB Items with Optimistic Locking (`version`), AI->MANUAL Badge Transition (AC-CRM-04) & Approval Tier Evaluation (FR-CRM-17)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: RAB saved and new version snapshot created
        '409':
          description: Optimistic lock version conflict
        '422':
          description: Validation error (e.g. contingency < 5% without reason)

  /crm/leads/{id}/rab/recalculate:
    post:
      tags: [CRM - RAB Engine]
      summary: Recalculate RAB Totals & Margin for Lead
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recalculated RAB summary

  /crm/leads/{id}/rab/autosave:
    patch:
      tags: [CRM - RAB Engine]
      summary: Auto-Save RAB Draft In-Place Without Incrementing Version
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Draft autosaved

  /crm/leads/{id}/rab/versions:
    get:
      tags: [CRM - RAB Engine]
      summary: List RAB Version History for Lead
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of RAB versions

  /crm/leads/{id}/rab/diff:
    get:
      tags: [CRM - RAB Engine]
      summary: Compare Two RAB Versions (Qty, Unit Price, Subtotal & Summary Diff)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Structured version diff

  /crm/leads/{id}/rab/import-catalog:
    post:
      tags: [CRM - RAB Engine]
      summary: Import Modules from Template Catalog into RAB (`origin = TEMPLATE`)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Catalog modules imported

  /crm/leads/{id}/rab/import-excel:
    post:
      tags: [CRM - RAB Engine]
      summary: Import RAB Items from Excel/CSV File or Rows Array
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
